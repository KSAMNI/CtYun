name: .NET and Docker (ghcr.io)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ctyun

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    # 检出代码
    - uses: actions/checkout@v4

    # 设置 .NET 环境
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # 确定版本号
    - name: Read project version
      id: get-version
      run: |
        version=$(grep -oP '(?<=<FileVersion>).*?(?=</FileVersion>)' CtYun/CtYun.csproj)
        if [ -z "$version" ]; then
          echo "Error: Unable to read version from CtYun.csproj"
          exit 1
        fi
        echo "version=$version" >> $GITHUB_ENV
        echo "Version: $version"

    # ghcr.io 要求镜像名全小写，这里统一转换为小写
    - name: Resolve image name
      run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> $GITHUB_ENV

    # 恢复依赖
    - name: Restore dependencies
      run: dotnet restore

    # 构建应用程序
    - name: Build
      run: dotnet build --no-restore --configuration Release

    # 发布应用程序
    - name: Publish Application
      run: dotnet publish CtYun/CtYun.csproj -c Release -p:PublishAot=false -o publish

    # 登录 GitHub Container Registry
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 设置 Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container

    # 构建并推送多架构镜像（同时打上版本标签与 latest）
    - name: Build and Push Multi-Arch Docker Image
      run: |
        docker buildx build \
          --no-cache \
          --platform linux/amd64,linux/arm64 \
          -t ${{ env.IMAGE }}:${{ env.version }} \
          -t ${{ env.IMAGE }}:latest \
          -f ./CtYun/Dockerfile \
          --push .

    - name: Summary
      run: |
        echo "### 镜像已推送 :rocket:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- \`${{ env.IMAGE }}:${{ env.version }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- \`${{ env.IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
